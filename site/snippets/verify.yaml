# Canonical release verification commands.

release_verify:
  cmd: |
    omegon-maintain --json release verify \
      --archive /absolute/path/omegon-<version>-<target>.tar.gz \
      --manifest /absolute/path/omegon-<version>-<target>.tar.gz.manifest.json \
      --bundle /absolute/path/omegon-<version>-<target>.tar.gz.manifest.sigstore.json
  desc: "Verify a release package offline against compiled identity policy"

gh_attestation:
  cmd: "gh attestation verify omegon-*.tar.gz --repo styrene-lab/omegon"
  desc: "Verify GitHub Attestations (build provenance)"
