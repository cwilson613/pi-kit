[package]
name = "omegon"
description = "Rust-native agent loop and lifecycle engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "omegon"
path = "src/main.rs"

[[example]]
name = "fractal_demo"
required-features = ["tui"]

[[example]]
name = "instrument_lab"
required-features = ["tui"]

[dependencies]
omegon-extension = "0.25"
omegon-maintenance-contracts = { path = "../omegon-maintenance-contracts" }
omegon-traits = { path = "../omegon-traits" }
omegon-git = { path = "../omegon-git" }
git2 = { version = "0.20", features = ["vendored-libgit2", "vendored-openssl"] }
shlex = "1.3"
agent-client-protocol = { version = "0.12", features = ["unstable"] }
ignore = "0.4"
grep-regex = "0.1"
grep-matcher = "0.1"
omegon-memory = { path = "../omegon-memory", features = ["agent"] }
omegon-codescan-contracts = { path = "../omegon-codescan-contracts" }
omegon-secrets = { path = "../omegon-secrets", features = ["agent"] }
omegon-opsx = { path = "../omegon-opsx" }
omegon-skills = { path = "../omegon-skills" }
omegon-web = { path = "../omegon-web" }
styrene-work-model = { path = "../styrene-work-model" }
styrene-work-runtime = { path = "../styrene-work-runtime" }
tokio = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
serde_json = { workspace = true }
jsonc-parser = { workspace = true }
serde_yaml = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
rusqlite = { workspace = true }
tokio-util = { workspace = true }
indexmap = { workspace = true }
flynt-models = { workspace = true }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
dirs = "6.0.0"
socket2 = { version = "0.5", features = ["all"] }
unicode-truncate = "2.0"
chrono = "0.4"
libc = "0.2"
regex-lite = "0.1"
url = "2"
ratatui = { version = "0.30.0", optional = true }
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-onig"] , optional = true }
tui-syntax-highlight = { version = "0.2", optional = true }
tachyonfx = { version = "0.25.0", features = ["sendable"] , optional = true }
crossterm = { version = "0.29.0", optional = true }
reqwest = { version = "0.13.2", features = ["json", "stream", "blocking"] }
tokio-stream = "0.1.18"
sha2 = "0.10.9"
fs2 = "0.4"
tempfile = "3.27.0"
secrecy = "0.10"
sysinfo = "0.33"
getrandom = "0.4.2"
open = "5.3.3"
tracing-appender = "0.2.4"
unicode-width = { version = "0.2.2", optional = true }
ratatui-image = { version = "11.0.2", default-features = false, features = ["crossterm", "image-defaults"] , optional = true }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] , optional = true }
axum = { version = "0.8.8", features = ["ws", "macros"] }
tower-http = { version = "0.6.8", features = ["cors"] }
rustls = "0.23"
rustls-pemfile = "2"
tokio-rustls = "0.26"
futures = "0.3"
futures-util = "0.3.32"
base64 = "0.22"
hmac = "0.12"
ansi-to-tui = { version = "8.0", optional = true }
tui-tree-widget = { version = "0.24", optional = true }
ratatui-toaster = { version = "0.1", optional = true }
ratatui-textarea = { version = "0.9.1", features = ["crossterm"] , optional = true }
tui-popup = { version = "0.7", optional = true }
hyperrat = { version = "0.1", optional = true }
rmcp = { version = "1.2", features = ["transport-child-process", "client", "transport-streamable-http-client-reqwest", "auth"], default-features = false }
tar = "0.4"
flate2 = "1.0"
sigstore = { version = "0.13.0", default-features = false, features = ["cosign", "rustls-tls"], optional = true }
x509-parser = { version = "0.17", optional = true }
rpassword = "7"
rpkl = "0.8"
percent-encoding = "2"
styrene-mqtt = "0.1.0"
styrene-rbac = "0.1.0"
omegon-rbac = { path = "../omegon-rbac" }
cron = "0.16"
notify = "8.0"
content_inspector = "0.2"
mime_guess = "2"
portable-pty = "0.9.0"

# Local embedding (optional — adds ~15MB ONNX Runtime to binary)
ort = { version = "2.0.0-rc.12", optional = true, features = ["ndarray"] }
tokenizers = { version = "0.23", optional = true, default-features = false, features = ["onig"] }
ndarray = { version = "0.17", optional = true }

[features]
default = ["tui", "self-update"]
task-capsule = []
self-update = ["dep:sigstore", "dep:x509-parser"]
tui = ["dep:ratatui", "dep:syntect", "dep:tui-syntax-highlight", "dep:tachyonfx", "dep:crossterm", "dep:unicode-width", "dep:ratatui-image", "dep:image", "dep:ansi-to-tui", "dep:tui-tree-widget", "dep:ratatui-toaster", "dep:ratatui-textarea", "dep:tui-popup", "dep:hyperrat"]
local-embeddings = ["dep:ort", "dep:tokenizers", "dep:ndarray"]

[dev-dependencies]
insta = "1.46"
