# Canonical install commands — parsed into site at build time, validated per release.
# Keys are referenced from Astro pages via snippet() calls.

quick_install:
  cmd: "curl -fsSL https://omegon.styrene.io/install.sh | OMEGON_BOOTSTRAP_VERIFIER=/absolute/path/to/independently-trusted/omegon-maintain sh"
  desc: "Install using an independently trusted external release verifier"

install_custom_dir:
  cmd: "curl -fsSL https://omegon.styrene.io/install.sh | OMEGON_BOOTSTRAP_VERIFIER=/absolute/path/to/independently-trusted/omegon-maintain INSTALL_DIR=~/.local/bin sh"
  desc: "Install to a custom directory"

install_nightly:
  cmd: "curl -fsSL https://omegon.styrene.io/install.sh | OMEGON_BOOTSTRAP_VERIFIER=/absolute/path/to/independently-trusted/omegon-maintain sh -s -- --channel=nightly"
  desc: "Install latest nightly"

install_version:
  cmd: "curl -fsSL https://omegon.styrene.io/install.sh | OMEGON_BOOTSTRAP_VERIFIER=/absolute/path/to/independently-trusted/omegon-maintain sh -s -- --version=v0.28.0"
  desc: "Install a specific version"

install_ci:
  cmd: "curl -fsSL https://omegon.styrene.io/install.sh | OMEGON_BOOTSTRAP_VERIFIER=/absolute/path/to/independently-trusted/omegon-maintain sh -s -- --no-confirm"
  desc: "Non-interactive install (CI)"

verify_companions:
  cmd: |
    omegon --version
    omegon-maintain --version
    omegon --which
    omegon-maintain --which
    omegon-maintain --json identity
  desc: "Verify the release-coupled executable pair and launcher freshness"
